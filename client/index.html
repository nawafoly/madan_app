<!doctype html>
<html lang="ar">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

  <title>MAEDIN - منصة الاستثمار العقاري</title>
  <meta name="description" content="منصة معدن لإدارة الاستثمارات والمشاريع العقارية بطريقة احترافية وآمنة." />

  <!-- ✅ Favicons (متوافق مع جميع المتصفحات) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png" />
  <script type="module">
    const appMode = String(import.meta.env.VITE_APP_MODE ?? "").trim().toLowerCase();
    const isHabatAttendance = appMode === "habat-attendance";

    if (isHabatAttendance) {
      const habatIcon = "/habat-alwaraq-logo.svg?v=20260906";

      document.title = "حبات الورق - نظام الحضور والانصراف";

      const description = document.querySelector('meta[name="description"]');
      if (description) {
        description.setAttribute(
          "content",
          "نظام حبات الورق لإدارة الحضور والانصراف والدوام والشفتات."
        );
      }

      document.querySelectorAll('link[rel="icon"]').forEach(link => {
        link.setAttribute("href", habatIcon);
        link.setAttribute("type", "image/svg+xml");
        link.removeAttribute("sizes");
      });

      const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
      if (appleIcon) {
        appleIcon.setAttribute("href", habatIcon);
        appleIcon.removeAttribute("sizes");
      }

      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.setAttribute("content", "#000000");

      const setMetaContent = (selector, value) => {
        const element = document.querySelector(selector);
        if (element) element.setAttribute("content", value);
      };

      setMetaContent('meta[property="og:site_name"]', "حبات الورق");
      setMetaContent('meta[property="og:title"]', "حبات الورق - نظام الحضور والانصراف");
      setMetaContent(
        'meta[property="og:description"]',
        "نظام حبات الورق لإدارة الحضور والانصراف والدوام والشفتات."
      );
      setMetaContent('meta[property="og:url"]', "https://habat-alwaraq.vercel.app/");
      setMetaContent('meta[name="twitter:title"]', "حبات الورق - نظام الحضور والانصراف");
      setMetaContent(
        'meta[name="twitter:description"]',
        "نظام حبات الورق لإدارة الحضور والانصراف والدوام والشفتات."
      );
    }

    if (import.meta.env.PROD) {
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = isHabatAttendance ? "/habat-manifest.json" : "/manifest.json";
      document.head.appendChild(link);
    }
  </script>
  <meta name="theme-color" content="#ffffff" />

  <!-- ✅ Open Graph (Link Preview عند إرسال الرابط) -->
  <meta property="og:site_name" content="MAEDIN" />
  <meta property="og:title" content="MAEDIN - منصة الاستثمار العقاري" />
  <meta property="og:description" content="منصة معدن لإدارة الاستثمارات والمشاريع العقارية بطريقة احترافية وآمنة." />
  <meta property="og:image" content="https://madan-app.vercel.app/og.png" />
  <meta property="og:image:secure_url" content="https://madan-app.vercel.app/og.png" />
  <meta property="og:image:alt" content="MAEDIN real estate investment platform logo" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:url" content="https://madan-app.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ar_SA" />

  <!-- ✅ Twitter Preview -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MAEDIN - منصة الاستثمار العقاري" />
  <meta name="twitter:description" content="منصة معدن لإدارة الاستثمارات والمشاريع العقارية بطريقة احترافية وآمنة." />
  <meta name="twitter:image" content="https://madan-app.vercel.app/og.png" />
  <meta name="twitter:image:alt" content="MAEDIN real estate investment platform logo" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body class="maedin-app-surface">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
