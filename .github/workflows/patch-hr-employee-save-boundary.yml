name: Patch HR employee save identity boundary

on:
  push:
    branches:
      - fix/hr-employee-save-identity-boundary-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/hr-employee-save-identity-boundary-20260831

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply employee-save identity boundary fix
        shell: python
        run: |
          from pathlib import Path

          component = Path('client/src/pages/admin/Employees.tsx')
          text = component.read_text(encoding='utf-8')

          old_identity_local = '''      const linkedUserUid =\n        String(selectedEmployee.uid || selectedEmployee.id || "").trim() ||\n        selectedEmployee.id;\n'''
          if text.count(old_identity_local) != 1:
              raise SystemExit(f'Expected exactly one linkedUserUid save-local declaration, got {text.count(old_identity_local)}')
          text = text.replace(old_identity_local, '', 1)

          old_auth_patch = '          authUid: linkedUserUid,\n'
          if text.count(old_auth_patch) != 1:
              raise SystemExit(f'Expected exactly one routine employee-save authUid patch, got {text.count(old_auth_patch)}')
          text = text.replace(
              old_auth_patch,
              '          // Identity binding is governed separately; routine HR profile edits must not mutate authUid.\n',
              1,
          )

          old_catch = '''    } catch {\n      toast.error("تعذر حفظ بيانات الموظف الوظيفية.");\n'''
          new_catch = '''    } catch (error) {\n      console.error("employee_profile_update_failed", error);\n      toast.error("تعذر حفظ بيانات الموظف الوظيفية.");\n'''
          if text.count(old_catch) != 1:
              raise SystemExit(f'Expected exactly one generic employee-save catch block, got {text.count(old_catch)}')
          text = text.replace(old_catch, new_catch, 1)

          component.write_text(text, encoding='utf-8')

          test_file = Path('server/hr-employee-save-identity-boundary.test.ts')
          test_file.write_text('''import { readFileSync } from "node:fs";\nimport { fileURLToPath } from "node:url";\nimport { dirname, resolve } from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst here = dirname(fileURLToPath(import.meta.url));\n\nfunction readRepoFile(relativePath: string) {\n  return readFileSync(resolve(here, "..", relativePath), "utf8");\n}\n\ndescribe("HR employee save identity boundary", () => {\n  it("keeps routine employee profile saves away from authUid mutations", () => {\n    const source = readRepoFile("client/src/pages/admin/Employees.tsx");\n    const start = source.indexOf("const handleSave = async () => {");\n    const end = source.indexOf("const handleSaveManualLeaveBalance", start);\n\n    expect(start).toBeGreaterThanOrEqual(0);\n    expect(end).toBeGreaterThan(start);\n\n    const saveBlock = source.slice(start, end);\n    expect(saveBlock).toContain("updateHrCoreEmployee(linkedEmployeeId");\n    expect(saveBlock).toContain("allowedZoneIds,");\n    expect(saveBlock).not.toContain("authUid:");\n    expect(saveBlock).not.toContain("linkedUserUid");\n  });\n\n  it("still lets HR Core synchronize the already-canonical auth binding", () => {\n    const worker = readRepoFile("workers/hr-core-worker.js");\n    expect(worker).toContain(\n      'const nextAuthUid = Object.prototype.hasOwnProperty.call(patch, "authUid")'\n    );\n    expect(worker).toContain(": before.auth_uid;");\n  });\n});\n''', encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression tests
        run: npx vitest run server/hr-employee-save-identity-boundary.test.ts server/hr-core-worker.test.ts

      - name: Build
        run: npm run build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/admin/Employees.tsx server/hr-employee-save-identity-boundary.test.ts
          git diff --cached --check
          git commit -m "fix(hr): keep employee edits outside identity binding"
          git push origin HEAD:fix/hr-employee-save-identity-boundary-20260831
