name: PR19 attendance validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Attendance tests
        run: npx vitest run server/attendance-hr-zone-source.test.ts server/attendance-worker.test.ts

      - name: Type-check regression gate
        shell: bash
        run: |
          set +e
          HEAD_SHA="$(git rev-parse HEAD)"
          npm run check > /tmp/head-check.log 2>&1
          grep "error TS" /tmp/head-check.log | sort > /tmp/head-errors.txt || true

          git checkout --detach origin/main
          npm run check > /tmp/base-check.log 2>&1
          grep "error TS" /tmp/base-check.log | sort > /tmp/base-errors.txt || true

          git checkout --detach "$HEAD_SHA"
          set -e

          echo "Existing main TypeScript errors:"
          cat /tmp/base-errors.txt || true
          echo "PR TypeScript errors:"
          cat /tmp/head-errors.txt || true
          diff -u /tmp/base-errors.txt /tmp/head-errors.txt

      - name: Build
        run: npm run build
