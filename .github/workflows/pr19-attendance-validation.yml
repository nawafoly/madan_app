name: PR19 attendance validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Attendance tests
        run: npx vitest run server/attendance-hr-zone-source.test.ts server/attendance-worker.test.ts

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
