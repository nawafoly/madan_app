name: Apply HR Core staff account sync patch

on:
  push:
    branches:
      - fix/hr-core-staff-account-sync

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/admin/CreateStaffAccount.tsx')
          text = path.read_text(encoding='utf-8')
          marker = 'HR_CORE_STAFF_ACCOUNT_SYNC_V1'
          if marker in text:
              print('Patch already applied.')
              raise SystemExit(0)

          import_anchor = 'import { languageDir, textAlignClass, tr } from "@/lib/i18n";\n'
          import_block = '''import {\n  HR_CORE_D1_ENABLED,\n  createHrCoreEmployee,\n  getHrCoreEmployee,\n  isHrCoreConfigured,\n  updateHrCoreAccount,\n  updateHrCoreEmployee,\n  type HrCoreEmployeeInput,\n} from "@/lib/hrCoreApi";\n'''
          if import_anchor not in text:
              raise SystemExit('Import anchor not found')
          text = text.replace(import_anchor, import_anchor + import_block, 1)

          helper_anchor = '''  const isKnownPermission = (\n    permissionKey: unknown\n  ): permissionKey is Permission => {\n'''
          helper = '''  // HR_CORE_STAFF_ACCOUNT_SYNC_V1\n  const ensureHrCoreEmployee = async ({\n    uid,\n    email,\n    displayName,\n    phone = "",\n    title = "",\n    isActive = true,\n    avatarUrl = "",\n  }: {\n    uid: string;\n    email: string;\n    displayName: string;\n    phone?: string;\n    title?: string;\n    isActive?: boolean;\n    avatarUrl?: string;\n  }) => {\n    if (!HR_CORE_D1_ENABLED) return null;\n    if (!isHrCoreConfigured()) {\n      throw new Error("hr_core_not_configured");\n    }\n\n    const employeePayload: HrCoreEmployeeInput = {\n      authUid: uid,\n      name: displayName,\n      email,\n      phone: phone || null,\n      avatarUrl: avatarUrl || null,\n      title: title || null,\n      employmentStatus: isActive ? "active" : "inactive",\n      isActive,\n      personal: {},\n      employment: {\n        employmentStatus: isActive ? "active" : "inactive",\n        status: isActive ? "active" : "inactive",\n        title: title || null,\n        jobTitle: title || null,\n      },\n    };\n\n    try {\n      const current = await getHrCoreEmployee(uid);\n      return await updateHrCoreEmployee(current.employee.id, employeePayload);\n    } catch (error: any) {\n      const isMissing =\n        error?.status === 404 || error?.code === "employee_not_found";\n      if (!isMissing) throw error;\n    }\n\n    return createHrCoreEmployee({\n      id: uid,\n      ...employeePayload,\n    });\n  };\n\n'''
          if helper_anchor not in text:
              raise SystemExit('Helper anchor not found')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          create_anchor = '''      await setDoc(\n        doc(db, "employees", createdUid),\n        buildDefaultEmployeePayload({\n          uid: createdUid,\n          email: normalizedEmail,\n          displayName: name,\n          phone: phoneValue,\n          isActive: true,\n          avatarUrl: createdAvatarUrl,\n        }),\n        { merge: true }\n      );\n'''
          create_d1 = '''\n      await ensureHrCoreEmployee({\n        uid: createdUid,\n        email: normalizedEmail,\n        displayName: name,\n        phone: phoneValue,\n        isActive: true,\n        avatarUrl: createdAvatarUrl,\n      });\n\n      if (HR_CORE_D1_ENABLED) {\n        await updateHrCoreAccount(createdUid, {\n          email: normalizedEmail,\n          username: normalizedUsername,\n          displayName: name,\n          title: null,\n          role: "staff",\n          isActive: true,\n          employeeProfileEnabled: true,\n          linkedEmployeeId: createdUid,\n        });\n      }\n'''
          if text.count(create_anchor) != 1:
              raise SystemExit(f'Create employee anchor count={text.count(create_anchor)}')
          text = text.replace(create_anchor, create_anchor + create_d1, 1)

          promote_anchor = '''      await setDoc(\n        doc(db, "employees", userDoc.id),\n        buildDefaultEmployeePayload({\n          uid: userDoc.id,\n          email: normalizedTargetEmail,\n          displayName,\n          phone: String(userData?.phone || "").trim(),\n          title,\n          isActive,\n        }),\n        { merge: true }\n      );\n'''
          promote_d1 = '''\n      await ensureHrCoreEmployee({\n        uid: userDoc.id,\n        email: normalizedTargetEmail,\n        displayName,\n        phone: String(userData?.phone || "").trim(),\n        title,\n        isActive,\n      });\n\n      if (HR_CORE_D1_ENABLED) {\n        await updateHrCoreAccount(userDoc.id, {\n          email: normalizedTargetEmail,\n          username: normalizedUsername,\n          displayName,\n          title: title || null,\n          role: roleKey,\n          isActive,\n          employeeProfileEnabled: true,\n          linkedEmployeeId: userDoc.id,\n        });\n      }\n'''
          if text.count(promote_anchor) != 1:
              raise SystemExit(f'Promote employee anchor count={text.count(promote_anchor)}')
          text = text.replace(promote_anchor, promote_anchor + promote_d1, 1)

          old_error = '''        setLocalError(\n          "تم إنشاء الحساب في Authentication، لكن فشلت تهيئة بياناته داخل Firestore بسبب الصلاحيات."\n        );\n        setLocalInfo(\n          "الحساب أُنشئ فعليًا، لكن يلزم إصلاح صلاحيات Firestore أو إكمال التهيئة يدويًا."\n        );\n'''
          new_error = '''        setLocalError(\n          "تم إنشاء حساب الدخول، لكن فشل إكمال تهيئة ملف الموظف وربطه بنظام الموارد البشرية."\n        );\n        setLocalInfo(\n          "الحساب موجود فعليًا، لكن العملية لم تعتبر مكتملة. أعد المحاولة بنفس البريد لإصلاح الربط تلقائيًا."\n        );\n'''
          if old_error not in text:
              raise SystemExit('Error message anchor not found')
          text = text.replace(old_error, new_error, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch markers
        shell: bash
        run: |
          grep -q 'HR_CORE_STAFF_ACCOUNT_SYNC_V1' client/src/pages/admin/CreateStaffAccount.tsx
          grep -q 'createHrCoreEmployee' client/src/pages/admin/CreateStaffAccount.tsx
          grep -q 'updateHrCoreAccount' client/src/pages/admin/CreateStaffAccount.tsx

      - name: Install dependencies
        run: npm ci

      - name: Run HR Core tests
        run: npx vitest run server/hr-core-worker.test.ts server/hr-firestore-cutover.test.ts server/hr-firestore-cutover-phase9b.test.ts server/hr-firestore-cutover-phase9c.test.ts server/hr-firestore-cutover-phase9d.test.ts

      - name: Build
        run: npm run build

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- client/src/pages/admin/CreateStaffAccount.tsx; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/admin/CreateStaffAccount.tsx
          git commit -m 'fix(hr): sync staff accounts to HR Core D1'
          git push origin HEAD:fix/hr-core-staff-account-sync
