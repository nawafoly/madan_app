name: Patch attendance rear camera

on:
  push:
    branches:
      - fix/attendance-default-rear-camera-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/attendance-default-rear-camera-20260831

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact camera-default patch
        shell: python
        run: |
          from pathlib import Path

          component = Path('client/src/components/EmployeeAttendanceCard.tsx')
          text = component.read_text(encoding='utf-8')

          replacements = [
              ('useState<CameraFacingMode>("user");', 'useState<CameraFacingMode>("environment");', 2),
              ('setCameraFacingMode("user");', 'setCameraFacingMode("environment");', 1),
              ('setActiveCameraFacingMode("user");', 'setActiveCameraFacingMode("environment");', 1),
          ]

          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'Unexpected count for {old!r}: expected {expected}, got {actual}')
              text = text.replace(old, new)

          component.write_text(text, encoding='utf-8')

          docs = Path('PHOTO_ATTENDANCE_DEPLOY.md')
          docs_text = docs.read_text(encoding='utf-8')
          old_doc = 'يفتح الكاميرا الأمامية مباشرة.'
          new_doc = 'يفتح الكاميرا الخلفية مباشرة، مع إمكانية التبديل للأمامية عند الحاجة.'
          if docs_text.count(old_doc) != 1:
              raise SystemExit('Expected exactly one front-camera documentation sentence')
          docs.write_text(docs_text.replace(old_doc, new_doc), encoding='utf-8')

      - name: Assert rear camera is the attendance default
        shell: bash
        run: |
          grep -q 'useState<CameraFacingMode>("environment")' client/src/components/EmployeeAttendanceCard.tsx
          grep -q 'setCameraFacingMode("environment")' client/src/components/EmployeeAttendanceCard.tsx
          grep -q 'setActiveCameraFacingMode("environment")' client/src/components/EmployeeAttendanceCard.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/EmployeeAttendanceCard.tsx PHOTO_ATTENDANCE_DEPLOY.md
          git diff --cached --check
          git commit -m "fix(attendance): default photo capture to rear camera"
          git push origin HEAD:fix/attendance-default-rear-camera-20260831
