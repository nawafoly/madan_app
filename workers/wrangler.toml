name = "upload"
main = "r2-upload-bootstrap.js"
compatibility_date = "2026-03-12"

# ARCHITECTURE NOTE (2026-03-12):
# Files are stored in Cloudflare R2.
# File metadata is stored in Cloudflare D1.
# Do not reintroduce Firestore metadata writes into this upload flow.

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "maedin-storage"

[[d1_databases]]
binding = "DOCUMENTS_DB"
database_name = "maedin-documents"
database_id = "06b05199-d41e-4757-a1a3-9d64ca559332"
migrations_dir = "migrations"

[[d1_databases]]
binding = "ATTENDANCE_DB"
database_name = "maedin-attendance"
database_id = "fd4dc78e-44b9-463f-aa21-d607355cfe93"
migrations_dir = "attendance-migrations"

# Attendance employee-zone resolution reads the canonical HR Core assignment.
# Firestore remains compatibility-only for employees that have not reached HR Core.
[[d1_databases]]
binding = "HR_DB"
database_name = "maedin-hr"
database_id = "6b2d4040-669f-434c-a74c-de2118ae9942"
