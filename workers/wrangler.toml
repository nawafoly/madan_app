name = "upload"
main = "r2-upload-worker.js"
compatibility_date = "2026-03-12"

# ARCHITECTURE NOTE (2026-03-12):
# Files are stored in Cloudflare R2.
# File metadata is stored in Cloudflare D1.
# Do not reintroduce Firestore metadata writes into this upload flow.

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "maedin-storage"

[[d1_databases]]
binding = "DOCUMENTS_DB"
database_name = "maedin-documents"
database_id = "ddc201f4-f49b-4634-a4fa-0c0f3fc4732f"
migrations_dir = "migrations"

[[d1_databases]]
binding = "ATTENDANCE_DB"
database_name = "maedin-attendance"
database_id = "b765c430-0bf1-4128-8c34-b1f57489aa3f"
migrations_dir = "attendance-migrations"